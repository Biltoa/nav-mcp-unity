name: ci

# What can be checked without a Unity licence, checked on every push.
#
# The parts that need a real Editor — the batch-mode smoke run over the whole catalog and the
# fleet measurements — are run locally with `umcp-bench --smoke` / `--fleet`, because a licensed
# Editor in CI is a cost this project's G3 requirement (no extra spend) rules out. The job below
# is honest about that rather than pretending a green tick covers it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore UnityMcpTool.sln

      - name: Build
        run: dotnet build UnityMcpTool.sln -c Release --no-restore

      - name: Test
        run: dotnet test UnityMcpTool.sln -c Release --no-build --logger "console;verbosity=normal"

      # One source of truth, enforced. The dispatch table, the daemon catalog and docs/TOOLS.md are
      # generated from the [UnityTool] methods; a commit that edits a tool without regenerating
      # them is drift, and drift between layers is the specific failure this design exists to
      # prevent.
      - name: Tool generation is up to date
        run: |
          dotnet run --project src/Umcp.ToolGen -c Release --no-build
          git diff --exit-code -- unity/com.umcp.agent/Editor/Generated src/Umcp.Daemon/Generated docs/TOOLS.md

      # The one hard rule the compiler cannot enforce: no Unity API on a thread that is not the
      # main thread. A socket thread that reads Application.productName throws silently, tears the
      # connection down, and reconnects forever with no log line — that cost an hour to find once.
      - name: No Unity API off the main thread
        run: dotnet run --project src/Umcp.MainThreadCheck -c Release --no-build

      # Every tool's examples must validate against that tool's own generated schema, every tool
      # must belong to a skill node, and no tool may be reachable without one. These are unit
      # tests, but they are the ones that keep the catalog honest, so they are named here.
      - name: Catalog quality gates
        run: dotnet test UnityMcpTool.sln -c Release --no-build --filter "FullyQualifiedName~CatalogTests|FullyQualifiedName~EnvelopeTests"

  # The daemon left Windows, so the build has to prove it on something that is not Windows. This
  # job is also where the macOS app comes from: there is no Mac in this project's development
  # loop, and an .app nobody has ever built is an .app that does not build.
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build and test on macOS
        run: |
          dotnet restore UnityMcpTool.sln
          dotnet build UnityMcpTool.sln -c Release --no-restore
          dotnet test UnityMcpTool.sln -c Release --no-build --logger "console;verbosity=normal"

      # Package the app itself. --skip-tests because the step above just ran them; the script
      # still enforces the generated-file and main-thread gates.
      - name: Package the app
        run: |
          chmod +x scripts/publish.sh
          scripts/publish.sh --arch both --skip-tests

      # A bundle that launches is the only evidence that the layout is right — the GUI looks for
      # umcpd in Contents/Resources, and a wrong path there is invisible until someone downloads
      # it. Headless, so it exits rather than showing a window: it is enough that the binary
      # resolves its runtime and its helpers.
      # The window itself, rendered on macOS. Until this existed the macOS claim rested on "it
      # compiles": this boots the real App with its real styles through Avalonia's headless
      # platform with Skia, captures every screen, and fails if any frame is missing. It is not a
      # human looking at a Mac, and it is a great deal more than nothing.
      - name: The window composes on macOS
        run: |
          dotnet run --project src/Umcp.Gui.Shots -c Release -- macos-shots
          for shot in overview projects connections settings overview-stopped; do
            test -s "macos-shots/$shot.png" || { echo "missing frame: $shot"; exit 1; }
          done
          echo "rendered:"; ls -la macos-shots

      - uses: actions/upload-artifact@v7
        with:
          name: nav-mcp-macos-screens
          path: macos-shots/*.png
          if-no-files-found: error

      - name: The bundle is shaped like an app
        run: |
          app="dist-mac/NAV MCP (arm64).app"
          test -x "$app/Contents/MacOS/NAV MCP"
          test -x "$app/Contents/Resources/umcpd"
          test -x "$app/Contents/Resources/umcp-stdio"
          test -f "$app/Contents/Resources/com.umcp.agent/package.json"
          test -f "$app/Contents/Info.plist"
          codesign --verify --verbose "$app"
          test -x "dist-mac/NAV MCP (x64).app/Contents/MacOS/NAV MCP"
          codesign --verify --verbose "dist-mac/NAV MCP (x64).app"

          # Run the binary that matches this runner. macos-latest is Apple Silicon, so executing
          # the x64 drop here fails on the .NET host's architecture rather than on anything about
          # this project — the same trap publish.ps1 hit when it asked a cross-built binary for
          # its version.
          case "$(uname -m)" in
            arm64) native="arm64" ;;
            *)     native="x64" ;;
          esac
          "dist-mac/NAV MCP ($native).app/Contents/Resources/umcpd" --version

      - uses: actions/upload-artifact@v7
        with:
          name: nav-mcp-macos
          path: |
            dist-mac/*.zip
            dist-mac/*.dmg
          if-no-files-found: error

  # The Windows drop, built the same way a release is, so the packaging script is exercised on
  # every push rather than on the day someone needs a build.
  windows-app:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Package the app
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipTests

      # The installer is what people actually download, so it is built on every push rather than
      # on the day somebody needs one. Unsigned, like the app it carries.
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc /Qp scripts\installer.iss
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if (-not (Test-Path "dist-installer\NAV-MCP-Setup-$version.exe")) { throw 'installer was not produced' }
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v7
        with:
          name: nav-mcp-windows-installer
          path: dist-installer/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: nav-mcp-windows
          path: dist/
          if-no-files-found: error
